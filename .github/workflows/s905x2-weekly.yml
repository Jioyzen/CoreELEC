name: S905X2-K media image
on:
  schedule:
    # Sunday 03:00 Asia/Shanghai (Saturday 19:00 UTC).
    - cron: '0 19 * * 6'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: Sync official CoreELEC into base, then base fixes into media branch
        type: boolean
        default: true
      publish:
        description: Publish the validated media image and update its feed
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: s905x2-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, coreelec-s905x2]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s905x2-no-fixes
          fetch-depth: 0
          clean: false
      - name: Pin the two source branches
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_UPSTREAM: ${{ github.event_name == 'schedule' || inputs.sync_upstream }}
        run: |
          set -euo pipefail
          git config user.name 'S905X2 build bot'
          git config user.email 's905x2-build@users.noreply.github.com'
          merge_or_stop() {
            if ! git merge --no-edit "$1"; then
              git merge --abort || true
              echo "::error::Upstream merge failed; both remote branches and published images are unchanged."
              exit 1
            fi
          }
          if [ "$SYNC_UPSTREAM" = true ]; then
            git fetch https://github.com/CoreELEC/CoreELEC.git coreelec-22
            merge_or_stop FETCH_HEAD
            ./tools/s905x2/test.sh
          fi
          base_sha=$(git rev-parse HEAD)
          git fetch origin s905x2-media-edition
          media_sha=$(git rev-parse FETCH_HEAD)
          if [ "$SYNC_UPSTREAM" = true ]; then
            git switch --detach "$media_sha"
            merge_or_stop "$base_sha"
            ./tools/s905x2/test.sh
            python3 -m unittest discover -s tools/media/tests -p 'test_*.py'
            media_sha=$(git rev-parse HEAD)
            # Stage and test BOTH merges before publishing either branch.
            # Reject the whole push if a branch changed concurrently.
            git push --atomic origin \
              "$base_sha:refs/heads/s905x2-no-fixes" \
              "$media_sha:refs/heads/s905x2-media-edition"
            git switch --detach "$base_sha"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "media_sha=$media_sha" >> "$GITHUB_OUTPUT"
          state=$(mktemp -d "$RUNNER_TEMP/s905x2-media.XXXXXX")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          cp tools/s905x2/publish_media.py "$state/publish_media.py"
          if [ "${{ github.event_name }}" = schedule ] && gh release download \
              --repo "$GITHUB_REPOSITORY" --pattern build-manifest.json --output "$state/previous.json"; then
            if python3 - "$state/previous.json" "$media_sha" <<'PYCODE'
          import json,sys
          data=json.load(open(sys.argv[1]))
          sys.exit(0 if data.get('edition')=='media' and data.get('source_commit')==sys.argv[2] else 1)
          PYCODE
            then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.sources.outputs.build == 'true'
        with:
          ref: ${{ steps.sources.outputs.media_sha }}
          fetch-depth: 0
          clean: false
      - name: Build and validate complete media image
        if: steps.sources.outputs.build == 'true'
        env:
          RELEASE_STATE: ${{ steps.sources.outputs.state }}
        run: |
          set -euo pipefail
          ./tools/media/build.sh
          cp -a target/s905x2-media-release "$RELEASE_STATE/release"
      - name: Preserve media image and validation reports
        if: steps.sources.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CE22-S905X2K-Media
          path: ${{ steps.sources.outputs.state }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish media image
        if: steps.sources.outputs.build == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ steps.sources.outputs.state }}
        run: python3 "$RELEASE_STATE/publish_media.py" --output "$RELEASE_STATE/release"
